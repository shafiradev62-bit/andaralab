version: '3.8'

services:
  backend:
    image: andaralab-backend:latest
    container_name: andaralab-localhost-backend
    ports:
      - "3002:3001"
    volumes:
      - ./data:/data
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped

  frontend:
    image: andaralab-frontend:latest
    container_name: andaralab-localhost-frontend
    ports:
      - "8081:80"
    environment:
      - BACKEND_URL=http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped
