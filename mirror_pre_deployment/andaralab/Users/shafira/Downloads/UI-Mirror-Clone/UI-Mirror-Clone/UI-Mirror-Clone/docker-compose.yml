version: '3.8'

services:
  # Frontend - Nginx serving Vite build
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - andaralab-network
    restart: unless-stopped

  # Backend - Express API server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATA_DIR=/data
      - APP_DIR=/opt/andara-lab
      - CORS_ALLOW_ALL=true
      - DEPLOY_WEBHOOK_SECRET=${DEPLOY_WEBHOOK_SECRET:-}
      # ── AWS S3 Sync (set these to enable continuous backup) ──────────────────
      # Data is uploaded to S3 on every write, and restored from S3 on startup
      # if local files are missing. This prevents data loss on container restarts.
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_S3_PREFIX=${AWS_S3_PREFIX:-andaralab-data}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_SYNC_ENABLED=${AWS_S3_SYNC_ENABLED:-true}
    volumes:
      # PERMANENT bind mount — data lives at /opt/andaralab-data on the host.
      # Survives container rebuilds, image changes, project renames, domain moves.
      - /opt/andaralab-data:/data
      # App dir bind mount — allows webhook to git pull & write .deploy-trigger
      - /opt/andara-lab:/opt/andara-lab
    networks:
      - andaralab-network
    restart: unless-stopped

networks:
  andaralab-network:
    driver: bridge
